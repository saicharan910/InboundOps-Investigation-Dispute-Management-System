services:
  - type: web
    name: inboundops-investigation
    runtime: python
    buildCommand: pip install -r requirements.txt && cd frontend && npm install && npm run build && cd ..
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_PATH
        value: /var/data/inboundops.db
    disk:
      name: inboundops-data
      mountPath: /var/data
      sizeGB: 1
